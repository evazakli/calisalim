<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>studyBuddy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

  <style>
    /* Tüm stiller aynı, eksiksiz */
    :root {
      --bg: #0d0f14; --bg2: #131720; --bg3: #1a1f2e; --card: #1e2436; --card2: #242b3d;
      --border: #2e3650; --accent: #6c63ff; --accent2: #a78bfa; --accent3: #34d399;
      --gold: #fbbf24; --text: #e8eaf6; --text2: #9aa5c4; --text3: #5c6888;
      --danger: #f87171; --warning: #fb923c; --shadow: 0 4px 24px rgba(0,0,0,.45);
      --radius: 14px; --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    }
    html[data-theme="light"] {
      --bg: #f0f2fa; --bg2: #e8ebf6; --bg3: #dde1f0; --card: #ffffff; --card2: #f5f7ff;
      --border: #d0d5ea; --text: #1a1f35; --text2: #4a5380; --text3: #8892b0; --shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg2)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    #app{display:flex;flex-direction:column;min-height:100vh}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
    .topbar-logo{font-family:var(--font-display);font-size:1.1rem;font-weight:800;color:var(--accent2);letter-spacing:-0.5px;white-space:nowrap;cursor:pointer;user-select:none}
    .topbar-logo:hover{opacity:0.8}
    .topbar-logo span{color:var(--text3);font-weight:400}
    .topbar-right{display:flex;align-items:center;gap:8px}
    .user-badge{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;font-size:.78rem;cursor:pointer;transition:border-color .2s}
    .user-badge:hover{border-color:var(--accent)}
    .user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
    .nav-tabs{display:flex;gap:0;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
    .nav-tabs::-webkit-scrollbar{display:none}
    .nav-tab{display:flex;align-items:center;gap:5px;padding:0 14px;height:44px;font-size:.8rem;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-body)}
    .nav-tab:hover{color:var(--text2)}
    .nav-tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
    .nav-tab svg{width:14px;height:14px}
    .main{flex:1;padding:16px;max-width:960px;margin:0 auto;width:100%}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
    .card-title{font-family:var(--font-display);font-size:.9rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:8px;font-family:var(--font-body);font-size:.82rem;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .18s;white-space:nowrap}
    .btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(108,99,255,.4)}
    .btn-primary:hover{background:var(--accent2);box-shadow:0 4px 18px rgba(167,139,250,.4)}
    .btn-secondary{background:var(--card2);color:var(--text2);border-color:var(--border)}
    .btn-secondary:hover{border-color:var(--accent);color:var(--text)}
    .btn-danger{background:rgba(248,113,113,.15);color:var(--danger);border-color:rgba(248,113,113,.3)}
    .btn-danger:hover{background:rgba(248,113,113,.25)}
    .btn-success{background:rgba(52,211,153,.15);color:var(--accent3);border-color:rgba(52,211,153,.3)}
    .btn-success:hover{background:rgba(52,211,153,.25)}
    .btn-sm{padding:5px 10px;font-size:.75rem}
    .btn-icon{padding:6px;border-radius:6px}
    .form-group{margin-bottom:12px}
    .form-label{display:block;font-size:.76rem;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
    .form-input,.form-select{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:var(--font-body);font-size:.9rem;color:var(--text);transition:border-color .2s;outline:none}
    .form-input:focus,.form-select:focus{border-color:var(--accent)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .progress-wrap{background:var(--bg2);border-radius:999px;height:7px;overflow:hidden}
    .progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
    .progress-bar.green{background:linear-gradient(90deg,var(--accent3),#10b981)}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
    .stat-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px}
    .stat-card-label{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:6px}
    .stat-card-value{font-family:var(--font-display);font-size:1.6rem;font-weight:800;color:var(--text);line-height:1}
    .stat-card-sub{font-size:.72rem;color:var(--text3);margin-top:2px}
    #presence-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;overflow:hidden}
    .empty-presence{text-align:center;padding:24px 0;color:var(--text3);font-size:.85rem}
    #presence-container{position:relative;width:100%;max-width:600px;margin:0 auto;min-height:250px}
    #presence-container svg{display:block;width:100%;height:auto}

    .activity-item{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap;transition:border-color .2s}
    .activity-item:hover{border-color:var(--accent)}
    .activity-item.running{border-color:var(--accent3)}
    .activity-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .activity-info{flex:1 1 60%;min-width:0}
    .activity-name{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .activity-meta{font-size:.72rem;color:var(--text3);margin-top:2px}
    .activity-timer{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--accent2);min-width:55px;text-align:right}
    .activity-timer.running{color:var(--accent3)}
    .activity-actions{display:flex;gap:4px;margin-left:auto}
    .calendar-event-item{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap;transition:border-color .2s}
    .calendar-event-item.overdue{border-color:var(--danger);background:rgba(248,113,113,.06)}
    .calendar-event-info{flex:1 1 60%;min-width:0}
    .calendar-event-title{font-weight:600;font-size:.85rem}
    .calendar-event-date{font-size:.72rem;color:var(--text3);margin-top:2px}
    .calendar-event-note{font-size:.72rem;color:var(--text2);margin-top:2px;font-style:italic}
    .calendar-event-countdown{font-family:var(--font-display);font-size:.9rem;font-weight:700;min-width:100px;text-align:right;color:var(--accent2)}
    .calendar-event-countdown.urgent{color:var(--warning)}
    .calendar-event-countdown.overdue{color:var(--danger)}
    .lb-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .lb-tab{padding:5px 14px;border-radius:999px;font-size:.78rem;font-weight:600;cursor:pointer;background:var(--card2);border:1px solid var(--border);color:var(--text3)}
    .lb-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .lb-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;margin-bottom:5px;background:var(--card2);border:1px solid var(--border)}
    .lb-rank{font-family:var(--font-display);font-weight:800;font-size:.9rem;min-width:28px;text-align:center;color:var(--text3)}
    .lb-name{flex:1;font-size:.85rem;font-weight:500}
    .lb-time{font-family:var(--font-display);font-weight:700;font-size:.85rem;color:var(--accent2)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
    .modal-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:440px;animation:slideUp .22s ease;max-height:90vh;overflow-y:auto}
    .modal-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700;margin-bottom:16px}
    .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    @keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    #toast-container{position:fixed;bottom:20px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:.82rem;font-weight:500;box-shadow:var(--shadow);animation:slideIn .25s ease}
    .toast.success{border-left-color:var(--accent3)}
    .toast.error{border-left-color:var(--danger)}
    @keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
    #loading-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}
    .flex{display:flex}.items-center{align-items:center}.gap-2{gap:6px}.mt-2{margin-top:6px}.mt-3{margin-top:10px}.text-sm{font-size:.78rem;color:var(--text2)}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
    .badge-purple{background:rgba(108,99,255,.2);color:var(--accent2)}
    .badge-green{background:rgba(52,211,153,.2);color:var(--accent3)}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
    #auth-screen{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
    .auth-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
    .auth-logo{font-family:var(--font-display);font-size:1.8rem;font-weight:800;color:var(--accent2);margin-bottom:20px}
    .auth-tabs{display:flex;gap:6px;margin-bottom:18px}
    .auth-tab{flex:1;padding:10px;font-weight:600;cursor:pointer;border-radius:8px;background:var(--bg2);color:var(--text3);border:1px solid var(--border);transition:.2s;font-size:.82rem}
    .auth-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .auth-form{display:flex;flex-direction:column;gap:14px;text-align:left}

    .guide-section { margin-bottom: 16px; }
    .guide-section h3 { font-family: var(--font-display); font-size: 1rem; color: var(--accent2); margin-bottom: 8px; }
    .guide-section p, .guide-section li { font-size: .85rem; color: var(--text2); line-height: 1.5; }
    .guide-section ul { list-style: none; padding-left: 0; }
    .guide-section ul li:before { content: "✦"; color: var(--accent); margin-right: 8px; }

    .history-filter-bar { display: flex; gap: 6px; margin-bottom: 16px; }
    .history-day-card { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .history-day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .history-day-title { font-weight: 700; font-size: .9rem; color: var(--text); }
    .history-day-total { font-size: .8rem; color: var(--accent2); font-weight: 600; background: rgba(108,99,255,.1); padding: 2px 10px; border-radius: 20px; }
    .history-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .history-item:last-child { border-bottom: none; }
    .history-time { font-size: .75rem; color: var(--text3); min-width: 50px; }
    .history-note { flex: 1; font-size: .85rem; color: var(--text); }
    .history-minutes { font-weight: 700; font-size: .85rem; color: var(--accent2); min-width: 55px; text-align: right; }

    @media (max-width:480px){.main{padding:12px}.topbar{padding:0 10px;height:50px}.topbar-logo{font-size:1rem}.user-badge{padding:2px 10px 2px 2px;font-size:.72rem}.stat-card{padding:12px}.stat-card-value{font-size:1.4rem}.activity-actions .btn{padding:4px 8px;font-size:.7rem}.calendar-event-countdown{min-width:80px;font-size:.8rem}.btn{padding:6px 12px;font-size:.78rem}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  <div style="font-family:var(--font-display);font-size:1rem;color:var(--text2);">studyBuddy bağlanıyor…</div>
</div>

<div id="toast-container"></div>

<!-- AUTH -->
<div id="auth-screen" class="hidden">
  <!-- ... auth ekranı aynen ... -->
</div>

<!-- APP -->
<div id="app" class="hidden">
  <!-- topbar, nav tabs aynen -->
  <main class="main">
    <!-- HOME, ACTIVITIES, CALENDAR aynen -->
    <!-- ÇALIŞMALARIM (HISTORY) -->
    <div id="tab-history" class="hidden">
      <div class="card">
        <div class="card-title">📋 Çalışmalarım</div>
        <div class="history-filter-bar">
          <button class="lb-tab active" data-period="week">Bu Hafta</button>
          <button class="lb-tab" data-period="month">Bu Ay</button>
          <button class="lb-tab" data-period="all">Tümü</button>
        </div>
        <div id="history-list">
          <div class="text-sm" style="text-align:center;padding:16px">Yükleniyor…</div>
        </div>
      </div>
    </div>
    <!-- STATS, LEADERBOARD aynen -->
  </main>
</div>

<!-- MODALLAR (kılavuz, profil, hedef) aynen -->

<script>
  // Firebase config...
  const firebaseConfig = {
  apiKey: "AIzaSyDCuodwSDZ_7ExK8hT6cTTV68ANs7OCLc4",
  authDomain: "calisalim.firebaseapp.com",
  databaseURL: "https://calisalim-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "calisalim",
  storageBucket: "calisalim.firebasestorage.app",
  messagingSenderId: "529858486083",
  appId: "1:529858486083:web:a169a0259c544ede1599f6",
  measurementId: "G-7JQD2XZ2ND"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const rtdb = firebase.database();

  // ... (diğer tüm değişkenler ve fonksiyonlar) ...

  // HISTORY (Çalışmalarım) - GÜVENLİ SÜRÜM
  async function loadHistory(period = 'week') {
    historyPeriod = period;
    const list = document.getElementById('history-list'); // $ yerine direkt çağır
    if (!list) {
      console.error('history-list elementi bulunamadı!');
      return;
    }
    list.innerHTML = '<div class="text-sm" style="text-align:center;padding:16px">Yükleniyor…</div>';

    const now = new Date();
    let startDate = null;
    if (period === 'week') {
      startDate = new Date(now);
      startDate.setDate(now.getDate() - 7);
    } else if (period === 'month') {
      startDate = new Date(now);
      startDate.setMonth(now.getMonth() - 1);
    }

    try {
      const snap = await db.collection('sessions')
          .where('userId', '==', currentUser.uid)
          .get();
      let allSessions = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(s => s.createdAt)
          .sort((a, b) => b.createdAt.toDate() - a.createdAt.toDate());
      if (startDate) allSessions = allSessions.filter(s => s.createdAt.toDate() >= startDate);
      allSessions = allSessions.slice(0, 500);

      if (!allSessions.length) {
        list.innerHTML = '<div class="text-sm" style="text-align:center;padding:16px">Bu dönemde kayıt yok.</div>';
        return;
      }

      const grouped = {};
      allSessions.forEach(s => {
        const d = s.createdAt.toDate();
        const key = d.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        if (!grouped[key]) grouped[key] = { sessions: [], total: 0 };
        grouped[key].sessions.push({
          time: d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
          note: s.note || 'Çalışma',
          minutes: s.minutes
        });
        grouped[key].total += s.minutes;
      });

      let html = '';
      Object.keys(grouped).forEach(dateStr => {
        const day = grouped[dateStr];
        html += `<div class="history-day-card">
          <div class="history-day-header">
            <span class="history-day-title">${dateStr}</span>
            <span class="history-day-total">Toplam: ${formatMin(day.total)}</span>
          </div>`;
        day.sessions.forEach(s => {
          html += `<div class="history-item">
            <span class="history-time">${s.time}</span>
            <span class="history-note">${s.note}</span>
            <span class="history-minutes">${s.minutes} dk</span>
          </div>`;
        });
        html += `</div>`;
      });
      list.innerHTML = html;
    } catch (err) {
      console.error('History yüklenirken hata:', err);
      list.innerHTML = '<div class="text-sm" style="text-align:center;padding:16px">Yüklenirken hata oluştu.</div>';
    }
  }

  // Sekme değiştirme
  document.querySelectorAll('.nav-tab').forEach(btn => btn.addEventListener('click', () => {
    // ... (diğer kod)
    if (tab === 'history') {
      loadHistory(historyPeriod);
    }
  }));

  // Filtre butonları
  document.querySelectorAll('#tab-history .lb-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tab-history .lb-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadHistory(btn.dataset.period);
    });
  });
</script>
</body>
</html>
